<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Shorts — habillage</title>
<style>
@font-face{font-family:'Anton';src:url(data:font/woff2;base64,__FONT_Anton__) format('woff2')}
@font-face{font-family:'DMSerif';src:url(data:font/woff2;base64,__FONT_DMSerif__) format('woff2')}
@font-face{font-family:'Poppins';font-weight:500;src:url(data:font/woff2;base64,__FONT_Poppins-500__) format('woff2')}
@font-face{font-family:'Poppins';font-weight:600 700;src:url(data:font/woff2;base64,__FONT_Poppins-700__) format('woff2')}
@font-face{font-family:'Poppins';font-weight:800 900;src:url(data:font/woff2;base64,__FONT_Poppins-800__) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#st{position:absolute;inset:0;overflow:hidden;font-family:Poppins,'Noto Color Emoji',sans-serif}
.a{position:absolute}
.emo{font-family:'Noto Color Emoji',sans-serif}
#top{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#tag{padding:8px 22px;border-radius:30px;background:var(--g);color:var(--ink);font:800 30px Poppins;letter-spacing:.06em;text-transform:uppercase}
#chap{font:400 66px Anton;color:#fff;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 4px 18px rgba(0,0,0,.6);white-space:nowrap;max-width:1020px;overflow:hidden}
#frame{position:absolute;left:0;top:250px;width:1080px;height:1350px;border-top:6px solid var(--g);border-bottom:6px solid var(--g);box-shadow:0 0 40px var(--glow)}
#cap{position:absolute;left:50px;right:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;column-gap:16px;row-gap:4px;text-align:center}
#cap span{display:inline-block;font:900 70px Poppins;color:#fff;text-transform:uppercase;letter-spacing:-.01em;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.65)}
#cap span.on{color:var(--g)}
.card{background:var(--card);border:3px solid var(--line);border-radius:34px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:24px;background:var(--g);color:var(--ink);font:800 50px Poppins;white-space:nowrap;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.pill.dark{background:var(--card);color:#fff;border:3px solid var(--g)}
.full{position:absolute;inset:0}
</style></head><body><div id="st">
<div id="top"><div id="tag"></div><div id="chap"></div></div>
<div id="frame"></div>
<div id="L"></div>
<div id="cap"></div>
</div>
<script>window.DATA=__DATA__;</script>
<script>
(function () {
  const D = window.DATA, DUR = D.duration, TH = D.theme, PLEIN = D.layout === 'plein';
  const root = document.documentElement.style;
  Object.entries(TH.vars).forEach(([k, v]) => root.setProperty('--' + k, v));
  const $ = (s) => document.getElementById(s);
  const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const P = (t, a, b) => cl((t - a) / Math.max(1e-6, b - a));
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const back = (x) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const lerp = (a, b, x) => a + (b - a) * x;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mk = (parent, html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const e = d.firstElementChild; parent.appendChild(e); return e; };
  const EV = []; const ev = (t, sfx, gain = .6) => { if (t >= 0 && t < DUR) EV.push({ t: +t.toFixed(3), sfx, gain }); };
  const L = $('L');

  // ---------------- géométrie selon le cadrage
  const top = $('top'), cap = $('cap'), frame = $('frame'), tag = $('tag'), chap = $('chap');
  let Z;
  if (PLEIN) {
    top.style.top = '70px'; top.style.height = '190px';
    chap.style.fontSize = '58px';
    frame.style.display = 'none';
    cap.style.top = '1470px'; cap.style.height = '210px';
    Z = { x: 70, y: 930, w: 940, h: 500 };
    // voile haut/bas pour la lisibilité sur l'image plein cadre
    mk($('st'), '<div class="a" style="left:0;right:0;top:0;height:330px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:-1"></div>');
  } else {
    top.style.top = '0'; top.style.height = '250px';
    cap.style.top = '1640px'; cap.style.height = '230px';
    Z = { x: 70, y: 1080, w: 940, h: 500 };
  }
  tag.textContent = D.tag || ''; if (!D.tag) tag.style.display = 'none';

  const inout = (e, t, t0, t1, dy = 80, sc = .85) => {
    const qi = P(t, t0, t0 + .35), qo = P(t, t1 - .3, t1);
    const on = t >= t0 - .01 && t < t1;
    if (e.__d === undefined) e.__d = e.style.display || '';
    e.style.display = on ? e.__d : 'none'; if (!on) return 0;
    e.style.opacity = Math.min(cl(qi * 3), 1 - qo);
    e.style.transform = `translateY(${(1 - back(qi)) * dy + qo * dy * .5}px) scale(${lerp(sc, 1, back(qi)) - qo * .05})`;
    return qi;
  };
  const fullIO = (el, t, c) => { const on = t >= c.t0 && t < c.t1; el.style.display = on ? '' : 'none'; if (on) el.style.opacity = Math.min(P(t, c.t0, c.t0 + .25), 1 - P(t, c.t1 - .25, c.t1)); return on; };
  const B = [];
  const CH = D.chapters || [];
  CH.forEach((c) => ev(c.t, 'whoosh', .35));
  const fit = (s, big, mid, small) => (s.length > 150 ? small : s.length > 95 ? mid : big);

  for (const c of D.cues) {
    if (c.type === 'compare') {
      const el = mk(L, `<div class="a card" style="left:${Z.x}px;top:${Z.y}px;width:${Z.w}px;padding:34px 40px;display:flex;flex-direction:column;gap:26px">${c.rows.map((r) => `
        <div class="row" style="display:flex;align-items:center;gap:20px;font:800 ${Math.max(r.a.length, r.b.length) > 14 ? 40 : 50}px Poppins;color:#fff;white-space:nowrap"><span>${esc(r.a)}</span><span style="font:400 60px Anton;color:var(--g)">→</span><span>${esc(r.b)}</span><span class="emo ok" style="margin-left:auto;font-size:76px">${r.ok ? '✅' : '❌'}</span></div>`).join('')}</div>`);
      const rows = [...el.querySelectorAll('.row')], oks = [...el.querySelectorAll('.ok')];
      c.rows.forEach((r) => { ev(r.at, 'pop', .5); ev(r.at_ok, r.ok ? 'ding' : 'buzz', .5); });
      B.push({ c, upd(t) { if (!inout(el, t, c.t0, c.t1)) return; rows.forEach((r, i) => { const q = P(t, c.rows[i].at - .1, c.rows[i].at + .25); r.style.opacity = cl(q * 3); r.style.transform = `translateX(${(1 - eo(q)) * -120}px)`; const qk = P(t, c.rows[i].at_ok, c.rows[i].at_ok + .25); oks[i].style.transform = `scale(${qk > 0 ? back(qk) : 0})`; }); } });
    }
    if (c.type === 'list') {
      const el = mk(L, `<div class="a" style="left:${Z.x}px;top:${Z.y}px;width:${Z.w}px;height:${Z.h}px;display:flex;flex-direction:column;align-items:center;justify-content:${c.items.length > 2 ? 'center' : 'flex-end'};gap:22px">${c.title ? `<div style="font:400 58px Anton;color:#fff;text-transform:uppercase;text-align:center;text-shadow:0 4px 16px rgba(0,0,0,.8)">${esc(c.title)}</div>` : ''}${c.items.map((it, i) => `<div class="pill ${i % 2 ? 'dark' : ''}" style="font-size:${it.text.length > 22 ? 40 : 50}px">${it.emoji ? `<span class="emo">${esc(it.emoji)}</span>` : ''}${esc(it.text)}</div>`).join('')}</div>`);
      const ps = [...el.querySelectorAll('.pill')];
      c.items.forEach((it) => ev(it.at, 'pop', .45));
      B.push({ c, upd(t) { if (!inout(el, t, c.t0, c.t1, 40, .95)) return; ps.forEach((p_, i) => { const q = P(t, c.items[i].at - .08, c.items[i].at + .3); p_.style.opacity = cl(q * 3); p_.style.transform = `scale(${lerp(.5, 1, back(q))}) rotate(${(i % 2 ? 2 : -2) * (1 - q)}deg)`; }); } });
    }
    if (c.type === 'verse') {
      const el = mk(L, `<div class="a card" style="left:${Z.x - 20}px;top:${Z.y - 10}px;width:${Z.w + 40}px;padding:30px 40px 34px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px"><span class="emo" style="font-size:52px">📖</span><span style="font:400 54px Anton;color:var(--g);letter-spacing:.02em;text-transform:uppercase">${esc(c.ref)}</span><span style="margin-left:auto;font:700 24px Poppins;color:rgba(255,255,255,.5)">Louis Segond 1910</span></div>
        <div style="font:italic 400 ${fit(c.text, 54, 48, 40)}px DMSerif;color:#fff;line-height:1.22">« ${c.text.split(' ').map((w) => `<span class="w" style="opacity:.15">${esc(w)} </span>`).join('')}»</div>
        <div class="bar" style="position:absolute;left:0;bottom:0;height:8px;width:0;background:linear-gradient(90deg,var(--gl),var(--g2))"></div></div>`);
      const ws = [...el.querySelectorAll('.w')], bar = el.querySelector('.bar');
      ev(c.t0, 'shimmer', .4); ev(c.t0 + .05, 'paper', .35);
      B.push({ c, upd(t) { if (!inout(el, t, c.t0, c.t1, 120, .9)) return; const k = P(t, c.t0 + .3, c.t0 + .3 + Math.min(3.2, (c.t1 - c.t0) * .6)); ws.forEach((w, i) => { w.style.opacity = i / ws.length <= k ? 1 : .15; }); bar.style.width = `${P(t, c.t0, c.t1) * 100}%`; } });
    }
    if (c.type === 'steps') {
      const el = mk(L, `<div class="a card" style="left:${Z.x}px;top:${Z.y - 30}px;width:${Z.w}px;padding:28px 36px">${c.title ? `<div style="font:400 50px Anton;color:var(--g);text-transform:uppercase;margin-bottom:14px">${esc(c.title)}</div>` : ''}${c.items.map((it, i) => `
        <div class="st" style="display:flex;align-items:center;gap:22px;margin:12px 0"><div class="n" style="flex:none;width:68px;height:68px;border-radius:50%;background:#2a2a33;color:#fff;font:400 40px Anton;display:flex;align-items:center;justify-content:center">${i + 1}</div><div class="tx" style="font:800 ${c.items.length > 4 ? 34 : 40}px Poppins;color:rgba(255,255,255,.35)">${esc(it.text)}</div></div>`).join('')}</div>`);
      const st = [...el.querySelectorAll('.st')];
      c.items.forEach((it) => ev(it.at, 'blip', .5));
      B.push({ c, upd(t) { if (!inout(el, t, c.t0, c.t1, 60, .92)) return; st.forEach((s, i) => { const on = t >= c.items[i].at; const cur = on && (i === st.length - 1 || t < c.items[i + 1].at); const n = s.querySelector('.n'); n.style.background = on ? 'var(--g)' : '#2a2a33'; n.style.color = on ? 'var(--ink)' : '#fff'; s.querySelector('.tx').style.color = on ? '#fff' : 'rgba(255,255,255,.35)'; s.style.transform = `scale(${cur ? 1.04 : 1})`; s.style.transformOrigin = '0 50%'; }); } });
    }
    if (c.type === 'contrast') {
      const sz = Math.max(c.a.length, c.b.length) > 10 ? .7 : 1;
      const el = mk(L, `<div class="a" style="left:0;right:0;top:${Z.y + 40}px;display:flex;align-items:center;justify-content:center;gap:26px">
        <div class="pa pill dark" style="font:400 ${76 * sz}px Anton">${esc(c.a)}</div><div class="ar" style="font:400 90px Anton;color:var(--g)">→</div><div class="pb pill" style="font:400 ${88 * sz}px Anton">${esc(c.b)}</div></div>`);
      const pa = el.querySelector('.pa'), ar = el.querySelector('.ar'), pb = el.querySelector('.pb');
      ev(c.at_a, 'pop', .5); ev(c.at_b, 'impact', .6);
      B.push({ c, upd(t) { if (!inout(el, t, c.t0, c.t1, 40, .95)) return; const qa = P(t, c.at_a - .1, c.at_a + .3), qb = P(t, c.at_b - .1, c.at_b + .3); pa.style.transform = `scale(${lerp(.5, 1, back(qa))})`; pa.style.opacity = cl(qa * 3) * (t > c.at_b ? .55 : 1); ar.style.opacity = qb; pb.style.opacity = cl(qb * 3); pb.style.transform = `scale(${lerp(1.8, 1, eo(qb))})`; } });
    }
    if (c.type === 'versus') {
      const el = mk(L, `<div class="a" style="left:${Z.x}px;top:${Z.y}px;width:${Z.w}px;height:${Z.h}px;display:flex;align-items:center;justify-content:center;gap:60px">
        <div class="b1" style="position:relative;text-align:center"><div class="emo" style="font-size:200px">${esc(c.a.emoji || '❔')}</div><div style="font:800 40px Poppins;color:#fff;text-shadow:0 3px 10px #000">${esc(c.a.label)}</div><div class="x" style="position:absolute;left:-10px;right:-10px;top:90px;height:16px;background:var(--red);border-radius:8px;transform:rotate(-30deg) scaleX(0)"></div></div>
        <div style="font:400 100px Anton;color:var(--g)">≠</div>
        <div class="b2" style="text-align:center"><div class="emo" style="font-size:200px">${esc(c.b.emoji || '✨')}</div><div style="font:800 40px Poppins;color:var(--g);text-shadow:0 3px 10px #000">${esc(c.b.label)}</div></div></div>`);
      const b1 = el.querySelector('.b1'), x = el.querySelector('.x'), b2 = el.querySelector('.b2');
      ev(c.at_a, 'pop', .5); ev(c.at_x, 'stamp', .5); ev(c.at_b, 'ding', .5);
      B.push({ c, upd(t) { if (!inout(el, t, c.t0, c.t1, 40, .95)) return; const q1 = P(t, c.at_a - .1, c.at_a + .3); b1.style.transform = `scale(${lerp(.4, 1, back(q1))})`; x.style.transform = `rotate(-30deg) scaleX(${eo(P(t, c.at_x, c.at_x + .25))})`; const q2 = P(t, c.at_b - .1, c.at_b + .3); b2.style.opacity = cl(q2 * 3); b2.style.transform = `scale(${lerp(.4, 1, back(q2))})`; } });
    }
    if (c.type === 'alert') {
      const el = mk(L, `<div class="a card" style="left:${Z.x}px;top:${Z.y + 40}px;width:${Z.w}px;padding:34px 40px;border-color:var(--red);display:flex;align-items:center;gap:30px"><span class="emo" style="font-size:120px">⚠️</span><div><div style="font:400 64px Anton;color:var(--red);text-transform:uppercase">${esc(c.title)}</div>${c.sub ? `<div style="font:700 38px Poppins;color:#fff;margin-top:6px">${esc(c.sub)}</div>` : ''}</div></div>`);
      ev(c.t0, 'impact', .55);
      B.push({ c, upd(t) { inout(el, t, c.t0, c.t1, 80, .85); } });
    }
    if (c.type === 'keyword') {
      const el = mk(L, `<div class="a" style="left:0;right:0;top:${Z.y + 120}px;display:flex;justify-content:center"><div class="pill" style="font:400 ${c.text.length > 16 ? 72 : 92}px Anton;padding:20px 44px;text-transform:uppercase">${c.emoji ? `<span class="emo" style="font-size:.9em">${esc(c.emoji)}</span>` : ''}${esc(c.text)}</div></div>`);
      const p = el.firstElementChild;
      ev(c.t0 + .1, 'impact', .5);
      B.push({ c, upd(t) { if (!inout(el, t, c.t0, c.t1, 30, .6)) return; p.style.transform = `rotate(${-2 + Math.sin(t * 3) * .6}deg)`; } });
    }
    if (c.type === 'cta') {
      const el = mk(L, `<div class="a" style="left:0;right:0;top:${Z.y + 80}px;display:flex;flex-direction:column;align-items:center;gap:26px">
        <div class="btn" style="display:flex;align-items:center;gap:20px;padding:26px 56px;border-radius:70px;background:#FE2C55;color:#fff;font:800 64px Poppins;box-shadow:0 18px 40px rgba(0,0,0,.5)"><span class="emo">🔔</span> ${esc(c.label)}</div>
        ${c.sub ? `<div class="cm pill dark" style="font:800 44px Poppins"><span class="emo">💬</span> ${esc(c.sub)}</div>` : '<div class="cm"></div>'}</div>`);
      const btn = el.querySelector('.btn'), cm = el.querySelector('.cm');
      ev(c.t0 + .1, 'pop_high', .6); ev(c.at_c, 'pop', .5);
      B.push({ c, upd(t) { if (!inout(el, t, c.t0, c.t1, 80, .8)) return; btn.style.transform = `scale(${1 + .04 * Math.sin(t * 6)})`; const q = P(t, c.at_c - .1, c.at_c + .3); cm.style.opacity = cl(q * 3); cm.style.transform = `scale(${lerp(.5, 1, back(q))})`; } });
    }
    if (c.type === 'full' && c.style === 'fill') {
      const el = mk(L, `<div class="full" style="background:radial-gradient(ellipse at 50% 45%,var(--bg2),var(--bg) 75%)">
        <div class="a" style="left:60px;right:60px;top:300px;text-align:center;font:400 ${c.title.length > 24 ? 80 : 96}px Anton;color:#fff;text-transform:uppercase;line-height:1.05">${esc(c.title)}</div>
        <svg class="a" style="left:240px;top:640px" width="600" height="600" viewBox="0 0 600 600"><defs><clipPath id="cc"><circle cx="300" cy="300" r="270"/></clipPath></defs>
          <circle cx="300" cy="300" r="270" fill="rgba(255,255,255,.06)" style="stroke:var(--g)" stroke-width="12"/>
          <g clip-path="url(#cc)"><rect class="fill" x="0" y="600" width="600" height="600" style="fill:var(--g)"/></g>
          <circle class="hole" cx="300" cy="300" r="120" style="fill:var(--bg)" stroke="rgba(255,255,255,.25)" stroke-width="6" stroke-dasharray="14 12"/></svg>
        <div class="a emo ic" style="left:0;right:0;top:830px;text-align:center;font-size:200px">${esc(c.emoji || '✨')}</div>
        <div class="a lab" style="left:60px;right:60px;top:1300px;text-align:center;font:400 84px Anton;color:var(--g);text-transform:uppercase">${esc(c.sub)}</div></div>`);
      const fill = el.querySelector('.fill'), hole = el.querySelector('.hole'), lab = el.querySelector('.lab'), ic = el.querySelector('.ic');
      ev(c.t0, 'whoosh_deep', .5); ev(c.at_fill, 'shimmer', .6);
      B.push({ c, full: true, upd(t) { if (!fullIO(el, t, c)) return; const f = eo(P(t, c.at_fill, c.at_fill + 1.4)); fill.setAttribute('y', String(600 - f * 600)); hole.setAttribute('r', String(120 * (1 - f))); ic.style.transform = `scale(${f > 0 ? back(P(t, c.at_fill + 1, c.at_fill + 1.4)) : 0})`; lab.style.opacity = P(t, c.at_fill + .3, c.at_fill + .6); } });
    }
    if (c.type === 'full' && c.style === 'sign') {
      const el = mk(L, `<div class="full" style="background:radial-gradient(ellipse at 50% 60%,var(--bg2),var(--bg) 75%)">
        <svg class="a" style="left:0;top:520px" width="1080" height="1000" viewBox="0 0 1080 1000"><path d="M380 1000 L520 120 L560 120 L700 1000Z" fill="#22222a"/><path class="dash" d="M540 980 L540 140" style="stroke:var(--g)" stroke-width="10" stroke-dasharray="40 30"/></svg>
        <div class="a sign" style="left:240px;top:620px;width:600px;padding:26px;border-radius:20px;background:linear-gradient(180deg,var(--gl),var(--g) 50%,var(--g2));text-align:center;font:400 ${c.title.length > 18 ? 58 : 72}px Anton;color:var(--ink);line-height:1.05;text-transform:uppercase;box-shadow:0 20px 50px rgba(0,0,0,.6)">${esc(c.title)}</div>
        <div class="a walker emo" style="left:470px;top:1300px;font-size:140px">${esc(c.emoji || '🚶🏾‍♂️')}</div>
        ${c.sub ? `<div class="a" style="left:60px;right:60px;top:260px;text-align:center;font:400 84px Anton;color:#fff;text-transform:uppercase;line-height:1.05">${esc(c.sub)}</div>` : ''}</div>`);
      const sign = el.querySelector('.sign'), wk = el.querySelector('.walker'), dash = el.querySelector('.dash');
      ev(c.t0, 'whoosh_deep', .5); ev(c.t0 + .4, 'impact', .55);
      B.push({ c, full: true, upd(t) { if (!fullIO(el, t, c)) return; const q = P(t, c.t0 + .2, c.t0 + .6); sign.style.transform = `scale(${lerp(.3, 1, back(q))})`; const k = P(t, c.t0, c.t1); wk.style.transform = `translate(${-20 * k}px,${-560 * eo(k)}px) scale(${1 - .55 * k})`; dash.style.strokeDashoffset = String(-t * 120); } });
    }
    if (c.type === 'full' && c.style === 'statement') {
      const el = mk(L, `<div class="full" style="background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg) 75%)">
        <div class="a ray" style="left:-460px;top:-60px;width:2000px;height:2000px;background:repeating-conic-gradient(from 0deg at 50% 50%,var(--glow) 0 6deg,transparent 6deg 18deg);opacity:.5"></div>
        <div class="a emo ic" style="left:0;right:0;top:470px;text-align:center;font-size:260px">${esc(c.emoji || '💡')}</div>
        <div class="a ti" style="left:60px;right:60px;top:880px;text-align:center;font:400 ${c.title.length > 22 ? 96 : 124}px Anton;color:#fff;text-transform:uppercase;line-height:1.02">${esc(c.title)}</div>
        ${c.sub ? `<div class="a su" style="left:60px;right:60px;top:1320px;text-align:center;font:800 54px Poppins;color:var(--g)">${esc(c.sub)}</div>` : '<div class="su"></div>'}</div>`);
